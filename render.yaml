services:
  - type: web
    name: cs221-weekend-together
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port "$PORT"
    healthCheckPath: /
    envVars:
      - key: TRIP_DB_PATH
        value: /var/data/trips.sqlite3
    disk:
      name: trip-data
      mountPath: /var/data
      sizeGB: 1
