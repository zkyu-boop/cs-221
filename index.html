<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekend Together</title>
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/app.js" defer></script>
</head>
<body>
<main>
<header><h1>Weekend Together</h1><p>Plan a Seattle-area trip with your friends.</p></header>
<p id="status" role="status" aria-live="polite" hidden></p>
<section id="lobby" class="grid">
<form id="create" class="panel">
<h2>Create a trip</h2>
<label>Trip name<input name="title" required maxlength="80"></label>
<label>Your name<input name="name" required maxlength="80"></label>
<div class="row">
<label>Trip length<select name="days"><option value="2">2 days</option><option value="3">3 days</option></select></label>
<label>Room size<select name="capacity"><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label>
</div>
<details><summary>Solver settings</summary>
<label>Fairness weight<input name="fairness" type="number" min="0" max="2" step=".05" value=".5" required></label>
<label>Replanning change penalty<input name="stability" type="number" min="0" max="2" step=".05" value=".25" required></label>
</details>
<button>Create room</button>
</form>
<form id="join" class="panel">
<h2>Join a trip</h2>
<label>Trip code<input name="code" required maxlength="80"></label>
<label>Your name<input name="name" required maxlength="80"></label>
<button>Join room</button>
</form>
</section>
<div id="room" hidden>
<section class="panel">
<h2 id="title"></h2>
<p id="identity"></p>
<div class="row">
<label>Invite link<input id="invite" readonly></label>
<button type="button" id="copy" class="secondary">Copy invite link</button>
<a href="/">Open another trip</a>
</div>
<p id="readiness"></p>
<ul id="members"></ul>
</section>
<div class="grid">
<form id="preferences" class="panel">
<h2>Your preferences</h2>
<label>Activity budget ($)<input name="budget" type="number" min="0" step="1" value="55" required></label>
<p class="muted">Rate each option from 0 to 5. Use exclusions for activities you cannot do.</p>
<div id="ratings"></div>
<fieldset><legend>Unavailable slots</legend><div id="unavailable"></div></fieldset>
<fieldset><legend>Excluded activities</legend><div id="excluded"></div></fieldset>
<button>Save preferences</button>
</form>
<section class="panel">
<h2>Itinerary</h2>
<p id="plan-message"></p>
<button id="generate" type="button" hidden>Generate itinerary</button>
<div id="metrics"></div>
<ol id="schedule"></ol>
<form id="feedback" hidden>
<label>Activity to remove<select id="activity"></select></label>
<button>Revise itinerary</button>
</form>
</section>
</div>
</div>
</main>
</body>
</html>
